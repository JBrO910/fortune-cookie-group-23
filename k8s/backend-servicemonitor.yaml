apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: fortune-cookie
    # This label must match the Prometheus Operator's serviceMonitorSelector.
    # kube-prometheus-stack defaults to selecting on 'release: kube-prometheus-stack'
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  endpoints:
    - port: metrics        # matches the named port in backend Service
      path: /metrics
      interval: 15s        # how often Prometheus scrapes
