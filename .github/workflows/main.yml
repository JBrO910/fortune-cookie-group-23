name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "stable"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  build-and-test:
    name: Build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: make build-${{ matrix.service }}

      - name: Test
        run: make test-${{ matrix.service }}

      - name: Test with coverage
        run: |
          cd ${{ matrix.service }}
          go test ./... -coverprofile=coverage.out -covermode=atomic
          COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}' | tr -d '%')
          echo "Coverage for ${{ matrix.service }}: ${COVERAGE}%"
          awk -v c="$COVERAGE" 'BEGIN { if (c < 80) exit 1 }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage.out

  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint
        run: make lint-${{ matrix.service }}

  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  publish:
    name: Publish image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, security-scan]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig

      - name: Deploy to Kubernetes
        run: |
          kubectl --kubeconfig kubeconfig apply -f k8s/ -n student-2
          kubectl --kubeconfig kubeconfig rollout restart deployment/backend -n student-2
          kubectl --kubeconfig kubeconfig rollout restart deployment/frontend -n student-2
          kubectl --kubeconfig kubeconfig rollout status deployment/backend -n student-2 --timeout=120s
          kubectl --kubeconfig kubeconfig rollout status deployment/frontend -n student-2 --timeout=120s
          kubectl --kubeconfig kubeconfig rollout status deployment/redis -n student-2 --timeout=120s

      - name: Smoke test deployed app
        run: |
          chmod +x scripts/smoke-test.sh
          kubectl --kubeconfig kubeconfig port-forward svc/frontend 8080:8080 -n student-2 >/tmp/frontend-portforward.log 2>&1 &
          echo $! > /tmp/frontend-portforward.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 2
          done
          ./scripts/smoke-test.sh http://127.0.0.1:8080

      - name: Clean up kubeconfig
        if: always()
        run: |
          if [ -f /tmp/frontend-portforward.pid ]; then
            kill $(cat /tmp/frontend-portforward.pid) || true
            rm -f /tmp/frontend-portforward.pid
          fi
          rm -f kubeconfig
