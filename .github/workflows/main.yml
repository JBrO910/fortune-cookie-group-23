name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "stable"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  build-and-test:
    name: Build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: make build-${{ matrix.service }}

      - name: Test
        run: make test-${{ matrix.service }}

      - name: Test with coverage
        run: |
          cd ${{ matrix.service }}
          go test ./... -coverprofile=coverage.out -covermode=atomic
          COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}' | tr -d '%')
          echo "Coverage for ${{ matrix.service }}: ${COVERAGE}%"
          awk -v c="$COVERAGE" 'BEGIN { if (c < 80) exit 1 }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage.out

  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint
        run: make lint-${{ matrix.service }}

  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  publish:
    name: Publish image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, security-scan]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Lint chart
        run: helm lint ./chart

      - name: Render chart
        run: helm template ./chart

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Set up kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig

      - name: Capture current release revision
        id: release_state
        run: |
          set -euo pipefail

          previous_revision=""
          if helm status fortune-cookie \
            --kubeconfig kubeconfig \
            --namespace student-2 >/dev/null 2>&1; then
            previous_revision=$(helm history fortune-cookie \
              --kubeconfig kubeconfig \
              --namespace student-2 \
              --max 20 | awk 'NR > 1 && $3 == "deployed" { revision = $1 } END { print revision }')
          fi

          echo "previous_revision=$previous_revision" >> "$GITHUB_OUTPUT"

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install fortune-cookie ./chart \
            --kubeconfig kubeconfig \
            --namespace student-2 \
            --set services.backend.image.tag=${{ github.sha }} \
            --set services.frontend.image.tag=${{ github.sha }} \
            --wait --timeout=180s --atomic

      - name: "Debug: show pods/service/endpoints and frontend logs"
        run: |
          echo "== pods =="; kubectl --kubeconfig kubeconfig get pods -n student-2 -o wide || true
          echo "\n== services =="; kubectl --kubeconfig kubeconfig get svc -n student-2 || true
          echo "\n== frontend service =="; kubectl --kubeconfig kubeconfig get svc frontend -n student-2 -o yaml || true
          echo "\n== endpoints for frontend =="; kubectl --kubeconfig kubeconfig get endpoints frontend -n student-2 -o yaml || true
          POD_NAME=$(kubectl --kubeconfig kubeconfig get pods -n student-2 -l app.kubernetes.io/name=frontend -o name 2>/dev/null | head -n1 | sed 's|pod/||') || true
          if [ -n "$POD_NAME" ]; then
            echo "\n== describe pod $POD_NAME =="; kubectl --kubeconfig kubeconfig describe pod "$POD_NAME" -n student-2 || true
            echo "\n== logs from pod $POD_NAME (last 200 lines) =="; kubectl --kubeconfig kubeconfig logs "$POD_NAME" -n student-2 --tail=200 || true
          else
            echo "No frontend pod found by selector app.kubernetes.io/name=frontend"
          fi

      - name: Smoke test deployed app
        id: smoke_test
        run: |
          chmod +x scripts/smoke-test.sh
          kubectl --kubeconfig kubeconfig port-forward svc/frontend 8080:8080 -n student-2 >/tmp/frontend-portforward.log 2>&1 &
          echo $! > /tmp/frontend-portforward.pid
          sleep 2
          for i in {1..60}; do
            if ! kill -0 $(cat /tmp/frontend-portforward.pid) 2>/dev/null; then
              echo "port-forward process died, log:"; sed -n '1,200p' /tmp/frontend-portforward.log; exit 1
            fi
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              echo "frontend is up"
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
            echo "healthz failed, port-forward log:"; sed -n '1,200p' /tmp/frontend-portforward.log; exit 1
          fi
          ./scripts/smoke-test.sh http://127.0.0.1:8080 || (echo "smoke-test failed, port-forward log:"; sed -n '1,200p' /tmp/frontend-portforward.log; exit 1)

      - name: Roll back failed deployment
        if: failure() && steps.smoke_test.outcome == 'failure'
        run: |
          set -euo pipefail

          if [ -n "${{ steps.release_state.outputs.previous_revision }}" ]; then
            helm rollback fortune-cookie "${{ steps.release_state.outputs.previous_revision }}" \
              --kubeconfig kubeconfig \
              --namespace student-2 \
              --wait --timeout=180s
          else
            helm uninstall fortune-cookie \
              --kubeconfig kubeconfig \
              --namespace student-2
          fi

      - name: Clean up kubeconfig
        if: always()
        run: |
          if [ -f /tmp/frontend-portforward.pid ]; then
            kill $(cat /tmp/frontend-portforward.pid) || true
            rm -f /tmp/frontend-portforward.pid
          fi
          rm -f kubeconfig

  stress-test:
    name: Stress test (Siege)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    steps:
      - name: Set up kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig

      - name: Port-forward frontend
        run: |
          kubectl --kubeconfig kubeconfig port-forward svc/frontend 8080:8080 -n student-2 >/tmp/frontend-portforward.log 2>&1 &
          echo $! > /tmp/frontend-portforward.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              echo "frontend is up"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null || (echo "healthz failed, port-forward log:"; sed -n '1,200p' /tmp/frontend-portforward.log; exit 1)

      - name: Run Siege stress test
        run: docker run --rm --network host rufus/siege-engine siege -c 20 -t 1M http://127.0.0.1:8080/

      - name: Clean up kubeconfig
        if: always()
        run: |
          if [ -f /tmp/frontend-portforward.pid ]; then
            kill $(cat /tmp/frontend-portforward.pid) || true
            rm -f /tmp/frontend-portforward.pid
          fi
          rm -f kubeconfig
